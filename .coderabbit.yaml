# CodeRabbit review settings for MeshCore TAK Bridge.
# Reference: https://docs.coderabbit.ai/reference/configuration
#
# Reviews should catch what has actually gone wrong in this project, and what would hurt users:
# writes to the radio, Bluetooth steps that can hang, servers that leak off the phone, CoT built
# from unescaped text, and workflow changes that could expose the release signing key. Style is
# left alone; the project has no formatter or linter for it.

language: en-GB # The docs and the app's text use British spelling (colour, licence).
tone_instructions: >-
  Be brief and concrete. Flag real defects and risks, with the failing case. Skip style, naming
  and refactoring suggestions unless they hide a bug. Write in plain British English.
early_access: false

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  sequence_diagrams: false

  path_filters:
    - "!**/build/**"
    - "!.gradle/**"
    - "!gradle/wrapper/gradle-wrapper.jar"
    - "!docs/screenshots/**"
    # Written by docs/icon/make_icon.py; review the script, not its output.
    - "!docs/icon/icon.svg"
    - "!app/src/main/res/drawable/ic_*.xml"

  path_instructions:
    - path: "**"
      instructions: |
        This Android app joins a MeshCore companion radio (Bluetooth LE) to ATAK through a TAK
        server on the same phone. Its design rules come from problems seen on devices; flag any
        change that breaks one:
        - Never write to the radio's configuration: no channels, contacts, settings, clock,
          advertised position, paths or keys. A new companion command needs a reason.
        - One Bluetooth operation at a time, and every operation has a time limit.
        - Use every channel the radio reports, not a fixed number of slots.
        - Send plain MeshCore channel text, readable by any MeshCore app.
        - Channels and companions are ATAK contacts, not GeoChat rooms.
        - Never send chat to a repeater or room server; they read admin text as commands.
        - Servers listen on 127.0.0.1 explicitly (not Android's default loopback, ::1), and
          nothing connects off the phone. No telemetry.
        - Events sent to ATAK are bare <event> elements with no XML declaration.
        Focus on correctness, security, thread safety, resource leaks and lost or duplicated
        messages. When a pull request changes behaviour, check that docs/STATUS.md and
        docs/DESIGN.md (and the README, if users would notice) are updated to match.

    - path: "protocol/**"
      instructions: |
        MeshCore companion protocol: frame encoding and decoding, and the client that runs the
        conversation with the radio. Everything from the radio is untrusted: check every length
        and offset before reading, and never let a malformed frame throw out of the client.
        One command is outstanding at a time, each with a time limit; check that a queued
        command cannot stall the queue. The only commands the bridge sends are reads
        (app start, device query, contacts, channels, waiting messages) and the two send-text
        commands; flag anything that sets, adds, removes or resets state on the radio.
        Undocumented layouts come from the MeshCore firmware source (MyMesh.cpp,
        BaseChatMesh.cpp); ask for a reference when a new one appears. ChannelReplies turns
        "@name" and "@@" into MeshCore's "@[Name]" reply form and must never guess between
        several matching names.

    - path: "cot/**"
      instructions: |
        Cursor on Target events for ATAK, built as strings. Every value that came from the
        mesh or from ATAK (names, text, uids, icon paths) must go through escapeXml in both
        attributes and text; flag any interpolation that skips it. Parsing is defensive, with
        length limits and patterns for uids and message ids. Event shapes follow ATAK's own
        source (GeoChat, receipts), so a change to them needs a reason from ATAK's behaviour.

    - path: "takserver/**"
      instructions: |
        The loopback TAK server (one client, keepalive replies, chat rate limit) and a minimal
        web API on port 8080 that answers ATAK's connect-time requests with empty lists.
        Check that sockets bind to 127.0.0.1 only, reject non-loopback peers, and are closed on
        every path; that web API requests have a read timeout (the CoT stream is long-lived by
        design and kept alive by ATAK's pings); that threads do not leak; and that the web API
        never returns real data or claims a TAK Server API version.

    - path: "app/src/main/kotlin/**/ble/**"
      instructions: |
        Bluetooth LE link to the radio. All work runs on the link's own handler thread. Check
        that each step clears its time limit, that close() is safe to call more than once, that
        callbacks from a superseded connection attempt are ignored, and that a failure always
        ends in onClosed with a reason. Samsung devices often fail a first connection with
        status 133, which is why connecting is retried.

    - path: "app/src/main/**"
      instructions: |
        The Android app: minSdk 26, targetSdk 34. Flag APIs newer than 26 without a version
        check, work on the wrong thread (network off the main thread, views only on it), and
        state shared between the radio, server and main threads without synchronisation.
        The screen is built in code; the only resources are the icons.

    - path: "**/src/test/**"
      instructions: |
        JUnit tests for the plain-Kotlin modules. Prefer tests of behaviour with recorded
        frames and real events. Flag tests that depend on timing (fixed sleeps) or on the
        order of hash-based collections, since CI has been flaky from those before.

    - path: ".github/workflows/**"
      instructions: |
        CI builds every pull request; release.yml signs releases with a key held in the
        `release` environment's secrets. Every action must be pinned to a full commit SHA with
        its version in a comment. Permissions stay least-privilege. Secrets must never be
        echoed, written to logs or to files outside $RUNNER_TEMP, and the keystore must be
        removed after use. Values from the event (tag names, titles) reach shell scripts only
        through env, never as ${{ }} inside run blocks.

    - path: "docs/**"
      instructions: |
        STATUS.md (what works, what was learned on devices, what is next), DESIGN.md (how and
        why) and RELEASING.md (the signed release procedure) must match the code. Check that
        statements about behaviour, limits and numbers are true of the code in this pull
        request, and that "checked on a device" is only claimed for things that were.

    - path: "docs/icon/make_icon.py"
      instructions: |
        Writes the app's icon drawables and docs/icon/icon.svg. If this script changes, the
        generated files should change with it in the same pull request.

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    # Dependabot's action updates are checked by CI, CodeQL and zizmor.
    ignore_usernames:
      - "dependabot[bot]"

  tools:
    # GitHub Actions: syntax, and security (the release job can read the signing key).
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    shellcheck:
      enabled: true
    # Secrets: a keystore or password must never land in the repository.
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true
    # Off: style linters with no project configuration would mostly add noise.
    detekt:
      enabled: false
    yamllint:
      enabled: false
    markdownlint:
      enabled: false
    languagetool:
      enabled: false

chat:
  auto_reply: true

knowledge_base:
  linked_repositories:
    - repository: "Colorado-Mesh/mesh-client"
      instructions: >-
        The Colorado Mesh desktop client, whose TAK server this app mirrors on a phone. What
        one learns about how ATAK behaves usually applies to the other.
